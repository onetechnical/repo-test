on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Golang
        uses: actions/setup-go@v2
        with:
          go-version: '1.24.1'
          cache: true
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: go mod download
      - name: Run tests
        run: go test
